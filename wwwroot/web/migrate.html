<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>提示词数据迁移</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 60px auto; padding: 20px; }
  h2 { color: #667eea; }
  .log { background: #f5f5f5; padding: 16px; border-radius: 8px; font-size: 13px; font-family: monospace; max-height: 400px; overflow-y: auto; }
  .log .ok { color: #10b981; }
  .log .err { color: #e74c3c; }
  .log .info { color: #667eea; }
</style>
</head>
<body>
<h2>提示词数据迁移工具</h2>
<p>正在将浏览器 IndexedDB 中的提示词数据迁移到服务端数据库...</p>
<div class="log" id="log"></div>
<script src="chrome-shim.js"></script>
<script src="/js/api.js"></script>
<script>
const log = document.getElementById('log');
function info(msg) { log.innerHTML += `<div class="info">${msg}</div>`; }
function ok(msg) { log.innerHTML += `<div class="ok">${msg}</div>`; }
function err(msg) { log.innerHTML += `<div class="err">${msg}</div>`; }

(async function() {
  if (!api.isLoggedIn()) {
    err('请先<a href="/login.html">登录</a>后再运行迁移');
    return;
  }

  try {
    // 打开 IndexedDB
    info('正在打开 IndexedDB...');
    const db = await new Promise((resolve, reject) => {
      const req = indexedDB.open('PromptProDB');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('数据库被阻塞'));
    });

    const storeNames = Array.from(db.objectStoreNames);
    info(`找到 ${storeNames.length} 个数据表: ${storeNames.join(', ')}`);

    const data = { userId: 1 };
    let totalItems = 0;

    for (const name of storeNames) {
      const items = await new Promise(resolve => {
        try {
          const tx = db.transaction(name, 'readonly');
          const req = tx.objectStore(name).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        } catch { resolve([]); }
      });
      const key = name === 'tag_relations' ? 'tagRelations' : name;
      data[key] = items;
      totalItems += items.length;
      ok(`  ${name}: ${items.length} 条`);
    }
    db.close();

    if (!data.prompts || !data.prompts.length) {
      info('IndexedDB 中没有提示词数据，无需迁移');
      return;
    }

    // 发送到服务端
    info(`正在上传 ${data.prompts.length} 条提示词到服务端...`);
    const result = await api.syncPrompts(data.userId, data);
    ok(`迁移完成！共导入 ${result.count} 条提示词`);
    ok(`总计迁移: ${totalItems} 条记录 (${storeNames.length} 个表)`);

    // 标记已迁移
    localStorage.setItem('prompt_migrated_to_server', '1');
    ok('已标记迁移状态，后续将使用服务端数据库');
    ok('<a href="/admin.html">前往管理后台</a>');

    // 可选：删除旧的 IndexedDB
    // indexedDB.deleteDatabase('PromptProDB');
    // ok('已清理浏览器旧数据库');
  } catch (e) {
    err('迁移失败: ' + (e.message || e));
  }
})();
</script>
</body>
</html>
