            <button class="sidebar-theme-btn" id="navThemeBtn" title="切换主题">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor"><path d="M481.15-140Q339-140 240.08-238.92 141.16-337.85 141.16-480q0-118.38 73.26-210.46 73.27-92.08 195.19-118.69 12.62-3.16 22.23.61 9.62 3.77 15.62 11.23 6 7.47 7.08 18.12 1.07 10.65-5 21.27-12.39 22.54-18.39 46.83t-6 51.09q0 98.33 68.84 167.17Q562.82-424 661.15-424q29.47 0 56.31-7.46 26.85-7.46 47-17.31 9.85-4.3 19.23-3.04 9.39 1.27 16.02 6.27 7.37 5 10.94 13.66 3.58 8.65.81 20.34-21.31 118-114.81 194.77Q603.15-140 481.15-140Zm0-60q88 0 158-48.5t102-126.5q-20 5-40 8t-40 3q-123 0-209.5-86.5T365.15-660q0-20 3-40t8-40q-78 32-126.5 102t-48.5 158q0 116 82 198t198 82Zm-10-270Z"/></svg>
            </button>
            <a href="/login.html" id="login-link" class="sidebar-toolbar-icon" title="登录" style="text-decoration:none;" onclick="window.location.href='/login.html';return false;">
              <i class="ri-login-box-line" style="font-size:14px;"></i>
            </a>
            <a href="/admin/" id="admin-link" class="sidebar-toolbar-icon" title="管理后台" style="text-decoration:none;display:none;">
              <i class="ri-dashboard-line" style="font-size:14px;"></i>
            </a>
            <a href="#" id="logout-link" class="sidebar-toolbar-icon" title="退出登录" style="text-decoration:none;display:none;" onclick="event.preventDefault();localStorage.removeItem('favshub_token');localStorage.removeItem('fh_local_favshub_token');location.href='/login.html'">
              <i class="ri-logout-box-r-line" style="font-size:14px;"></i>
            </a>
          </div>
        </div>
        <script>
          (function(){
            var loginEl = document.getElementById('login-link');
            var adminEl = document.getElementById('admin-link');
            var logoutEl = document.getElementById('logout-link');
            function updateAuthUI() {
              var token = localStorage.getItem('favshub_token') || localStorage.getItem('fh_local_favshub_token');
              if (token) {
                if (loginEl) loginEl.style.display = 'none';
                if (adminEl) adminEl.style.display = '';
                if (logoutEl) logoutEl.style.display = '';
              } else {
                if (loginEl) loginEl.style.display = '';
                if (adminEl) adminEl.style.display = 'none';
                if (logoutEl) logoutEl.style.display = 'none';
              }
              // 如果已登录但用户信息未就绪，异步获取后刷新欢迎消息
              if (token) {
                try {
                  var user = JSON.parse(localStorage.getItem('favshub_user'));
                  if (!user || user.nickname === undefined) {
                    fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
                      .then(function(r) { return r.ok ? r.json() : null; })
                      .then(function(data) {
                        if (data && data.user) {
                          localStorage.setItem('favshub_user', JSON.stringify(data.user));
                          if (window.WelcomeManager) window.WelcomeManager.updateWelcomeMessage();
                        }
                      }).catch(function(){});
                  }
                } catch (e) {}
              }
            }
            // 暴露到全局，供 chrome-shim 异步获取用户信息后回调
            window.updateAuthUI = updateAuthUI;
            updateAuthUI();
            // 延迟再检查一次（等 chrome-shim async fetch 完成）
            setTimeout(updateAuthUI, 1500);
          })();
        </script>
