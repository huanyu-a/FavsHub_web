name: Nuxt quality

on:
  push:
    branches: [main]
    paths:
      - 'favshub-nuxt/**'
      - 'favshub-data-ops/**'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'favshub-nuxt/**'
      - 'favshub-data-ops/**'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  nuxt-quality:
    name: Nuxt quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: favshub-nuxt/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: favshub-nuxt
        run: pnpm install --frozen-lockfile

      - name: Import/export static check
        working-directory: favshub-nuxt
        run: pnpm ts:check

      - name: TypeScript/Vue full typecheck
        working-directory: favshub-nuxt
        run: pnpm typecheck

      - name: Unit tests
        working-directory: favshub-nuxt
        run: pnpm test

      - name: Build
        working-directory: favshub-nuxt
        run: pnpm build

      # 真实 Nitro + 临时 SQLite 的限流边界必须在 build 后显式执行；
      # 前面 Unit tests 中对应 Vitest 包装在无 .output 时会跳过，不能作为本门禁的替代。
      - name: Runtime test — high-cost endpoint rate limits
        working-directory: favshub-nuxt
        run: node scripts/high-cost-endpoint-ratelimit.mjs

      - name: Runtime test — favicon fallback and SSRF rejection
        working-directory: favshub-nuxt
        run: node scripts/favicon-fallback-check.mjs
