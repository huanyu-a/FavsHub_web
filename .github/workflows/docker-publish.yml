name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - 'favshub-nuxt/VERSION'
  workflow_dispatch:

env:
  IMAGE_NAME: favshub
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VER=$(cat favshub-nuxt/VERSION | tr -d '[:space:]')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # 刻意不启用 setup-node 的 pnpm 缓存：lockfile 在子目录时，其 post 步骤会因
      # pnpm store 目录不存在而报 "Path(s) specified ... do(es) not exist"，使整个
      # run 显示失败（镜像其实已推送成功），掩盖真实故障。缓存收益约 1 分钟，不值。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: favshub-nuxt
        run: pnpm install --frozen-lockfile

      # ── 测试门禁 ───────────────────────────────────────────────
      # 这些套件**不需要数据库、不需要 .output 构建产物**，所以能在 build 之前跑，
      # 快速失败（省一次几分钟的镜像构建 + 一次错误的 GHCR 推送）。
      #
      # 只挑自包含的：end-to-end 套件（third-batch-*、second-batch-e2e、ai-api-smoke-*）
      # 要起本地服务 + 真实 SQLite，CI 里没有该环境，故不纳入。
      # 计入断言数：102 + 17 + 12 = 131 项。
      - name: Type check (named imports)
        working-directory: favshub-nuxt
        run: pnpm ts:check

      - name: Test — SSRF 内网地址判定
        working-directory: favshub-nuxt
        run: node scripts/private-ip-check.mjs

      # 该脚本 import 了 server/utils/sanitize.ts，依赖 Node 的原生 TS 类型剥离。
      # 显式给 flag：Node 22.6–22.17 需要它，22.18+ / 24 视为无害别名。
      - name: Test — 出站错误脱敏
        working-directory: favshub-nuxt
        run: node --experimental-strip-types scripts/sanitize-test.mjs

      - name: Test — SSRF 出站地址钉死（TOCTOU）
        working-directory: favshub-nuxt
        run: node scripts/ssrf-pin-check.mjs

      - name: Build Nuxt
        working-directory: favshub-nuxt
        run: pnpm build

      - name: Prepare Docker context
        working-directory: favshub-nuxt
        run: |
          rm -rf favshub/
          mkdir -p favshub
          cp -r .output/server favshub/server
          rm -rf favshub/server/node_modules
          cp -r .output/public favshub/public 2>/dev/null || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: favshub-nuxt
          file: favshub-nuxt/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
