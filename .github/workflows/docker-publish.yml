name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - 'favshub-nuxt/VERSION'
  workflow_dispatch:

env:
  IMAGE_NAME: favshub
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          # 不用 `cat ... | tr ...`：管道会把 `cat` 的失败退出码吃掉，
          # 于是「VERSION 文件不存在」会**静默通过**，payload 变成 `version=`（空）。
          # 下游 `docker/metadata-action` 拿空值会生成一个 `type=raw,value=` 的非法 tag
          # —— 恰恰在最该报错的时候不报错，然后推一个坏镜像。
          # 改为：先确保文件可读（set -e + 单独 cat），再校验内容非空。
          set -euo pipefail
          VER=$(tr -d '[:space:]' < favshub-nuxt/VERSION)
          if [ -z "$VER" ]; then
            echo "::error::favshub-nuxt/VERSION 为空或不可读，拒绝构建（否则会打出空 tag 的镜像）"
            exit 1
          fi
          # 基本形状校验：至少 x.y 或 x.y.z，避免把误编辑的内容当成版本号
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::favshub-nuxt/VERSION 内容不像版本号：'$VER'"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # ⚠️ 这一行不能省。该 action 的 `package_json_file` 默认是**仓库根**的
          # `package.json`，而本项目根目录没有（唯一的在 `favshub-nuxt/` 下）。
          #
          # 2026-10-31 实测漏掉它的后果 —— 本步直接报：
          #   Error: No pnpm version is specified.
          #   Please specify it by one of the following ways:
          #     - in the GitHub Action config with the key "version"
          #     - in the package.json with the key "packageManager"
          # 然后整个 job 在 **10 秒**内失败，后面 20 个步骤一个都没跑到。
          # 也就是说：CI 挂在一个纯配置问题上，而它看起来像是「pnpm 版本问题」。
          package_json_file: favshub-nuxt/package.json
        # 同时刻意**不写** `with.version`。该 action 的优先级是
        #   ① with.version 显式指定 → ② package_json_file 里的 packageManager → ③ latest
        # 原先写的是 `version: latest`，等于走 ①，把
        # `favshub-nuxt/package.json` 里 `packageManager: pnpm@9.15.4`（带 sha512）
        # **覆盖掉**了。
        #
        # 为什么必须跟随项目锁定的版本（2026-10-31）：
        #   · pnpm-lock.yaml 是 `lockfileVersion: '9.0'`（pnpm 9 的格式）；
        #   · Dockerfile 里 `corepack prepare pnpm@9.15.4 --activate` 也钉死 9.15.4；
        #   · 若 CI 用 pnpm 10，--frozen-lockfile 虽能读 9.0，但两类实现差异
        #     （peer 解析、依赖提升）可能让「CI 装的依赖」≠「镜像里装的依赖」，
        #     于是测试通过不代表镜像里是同一套依赖 —— 这种偏差极难排查。
        #   · pnpm 大版本还会改变 lockfile 格式，届时本地与 CI 互相改锁文件的噪音。
        #
        # 于是版本由 `favshub-nuxt/package.json` 的 packageManager 决定
        # （唯一真源，与 Dockerfile 的 corepack 声明一致）。
        # 若将来升级 pnpm，改 package.json + Dockerfile 两处即可，这里自动跟随。

      # 刻意不启用 setup-node 的 pnpm 缓存：lockfile 在子目录时，其 post 步骤会因
      # pnpm store 目录不存在而报 "Path(s) specified ... do(es) not exist"，使整个
      # run 显示失败（镜像其实已推送成功），掩盖真实故障。缓存收益约 1 分钟，不值。
      # ⚠️ 这里的 22 与 Dockerfile 的 node:20-alpine **刻意不同**，不是笔误：
      #   · CI 用 22 跑测试 —— 因为 `private-ip-check` / `sanitize-test` 需要
      #     `--experimental-strip-types`（Node ≥22.6）。Node 20 会直接报
      #     `bad option: --experimental-strip-types` 或 `ERR_UNKNOWN_FILE_EXTENSION`；
      #   · 镜像我行我素用 20 —— 那是**生产实际运行**的版本，Dockerfile 内部
      #     自己 install + build，且 .dockerignore 排除了 `node_modules` / `.output`，
      #     所以这边 22 的产物不会污染镜像。
      #   → 代价：**CI 验证的是 Node 22 的行为，线上跑的是 Node 20**。两者有差异时
      #     这套 CI 看不出来。已知且接受（应用本身不依赖 22 特性，测试工具才需要）。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: favshub-nuxt
        run: pnpm install --frozen-lockfile

      # ── 测试门禁 ───────────────────────────────────────────────
      # 这些套件**不需要数据库、不需要 .output 构建产物**，所以能在 build 之前跑，
      # 快速失败（省一次几分钟的镜像构建 + 一次错误的 GHCR 推送）。
      #
      # 只挑自包含的：end-to-end 套件（third-batch-*、second-batch-e2e、ai-api-smoke-*）
      # 要起本地服务 + 真实 SQLite，CI 里没有该环境，故不纳入。
      # 计入断言数：102 + 17 + 12 + 86 + 36 = 253 项。
      - name: Type check (named imports)
        working-directory: favshub-nuxt
        run: pnpm ts:check

      - name: Test — SSRF 内网地址判定
        working-directory: favshub-nuxt
        run: node scripts/private-ip-check.mjs

      # 该脚本 import 了 server/utils/sanitize.ts，依赖 Node 的原生 TS 类型剥离。
      # 显式给 flag：Node 22.6–22.17 需要它，22.18+ / 24 视为无害别名。
      - name: Test — 出站错误脱敏
        working-directory: favshub-nuxt
        run: node --experimental-strip-types scripts/sanitize-test.mjs

      - name: Test — SSRF 出站地址钉死（TOCTOU）
        working-directory: favshub-nuxt
        run: node scripts/ssrf-pin-check.mjs

      # 通告分类单一真源守卫：断言除 utils/deal-categories.ts 外没有任何文件再手抄
      # 一份分类清单（分类枚举曾散在 8 处，client/domain 各漏过一次）。
      # 同样需要 --experimental-strip-types —— 它 import 了 utils/deal-categories.ts。
      - name: Test — 通告分类单一真源
        working-directory: favshub-nuxt
        run: node --experimental-strip-types scripts/category-source-check.mjs

      # 书签图标解析守卫：断言「合法形态放行 / 坏值回落」。生产实测有 30 条
      # icon 是缺前导斜杠的相对路径（img/<hex>.webp），会渲染成 404 坏图标。
      - name: Test — 书签图标解析
        working-directory: favshub-nuxt
        run: node --experimental-strip-types scripts/favicon-resolve-check.mjs

      - name: Build Nuxt
        working-directory: favshub-nuxt
        run: pnpm build

      # ── 端到端套件（672 项断言）─────────────────────────────────
      # 这五个套件需要 `.output/`（自起服务 + 临时库），所以排在 build 之后。
      # 它们**在此前从未进过 CI**，只在本地手工跑过 —— 意味着「线上那条流水线
      # 从没验证过这 672 项」，只有维护者想起来才会跑。补上这一环。
      #
      # 关于 Node 版本：套件内部用 `spawn('node', ...)` 起服务（拿 PATH 上的 node），
      # 而 better-sqlite3 是原生模块、ABI 与 Node 大版本绑定。CI 全程 node 22
      # （install 与 run 同版本），所以一致；本地则要注意别用「装依赖的 node」
      # 之外的版本去跑，否则会得到「应用 30s 内未就绪」这种误导性报错。
      #
      # 六个套件实测合计约 15–20 秒（150 / 161 / 247 / 106 / 20 / 147），成本可忽略。
      #
      # 断言计数（2026-10-31 实测）：
      #   second-batch-e2e 150 · notify 161 · detail 247 · ratelimit 106 · cache-privacy 20 · server 147 = 831
      # 加上 build 前的 ts:check(954 导入) / private-ip 102 / sanitize 17 / ssrf-pin 12 / category-source 47，
      # CI 断言总计 1838。
      - name: Test — 第二批次 e2e（权限/可见性/SSRF）
        working-directory: favshub-nuxt
        run: node scripts/second-batch-e2e.mjs

      - name: Test — 通告事件流（脱敏/码池/订阅）
        working-directory: favshub-nuxt
        run: node scripts/third-batch-notify.mjs

      - name: Test — 通告详情页 SSR（两行可见性/内部字段）
        working-directory: favshub-nuxt
        run: node scripts/third-batch-detail.mjs

      # 限流与缓存两个套件也自包含（自己 spawn 服务、自己按 phase 覆盖 FAVSHUB_RL_*）。
      # ratelimit 把 `.output` 整体拷到 /tmp 再从副本启动，不污染工作区。
      # 实测 13s + 1s。
      - name: Test — 限流（三层阈值/并发释放/IP 取用）
        working-directory: favshub-nuxt
        run: node scripts/third-batch-ratelimit.mjs

      - name: Test — 缓存与隐私（Cache-Control/Vary/SSR payload）
        working-directory: favshub-nuxt
        run: node scripts/cache-privacy-check.mjs

      # 「福利 Key」复制端点的可见性契约。单开一个套件是因为：
      # `GET /api/token-keys/:id/copy` 是全站**唯一下发明文密钥**的接口
      # （列表/详情的 SELECT 列清单里根本没有 key_plain），它的守卫一失守，
      # 泄漏的是**可用的真实密钥**而不是元数据 —— 而此前它零覆盖。
      # 断言：可复制行才 200、其余分支一律 404 且**文案完全一致**（避免存在性泄露）、
      # 明文端点绝不入缓存、以及「列表遮蔽 / copy 给完整 base_url」这条**有意差异**
      # 不被日后「顺手统一」掉。
      - name: Test — 福利 Key 复制端点可见性（明文出口契约，24 项）
        working-directory: favshub-nuxt
        run: node scripts/key-copy-visibility.mjs

      # 管理后台 API 的鉴权面。`server/middleware/admin-guard.ts` 文件头自己写着
      # 「仅拦截 /admin 页面请求（排除 /api/ 和静态资源）」—— 那 79 个 /api/admin
      # 端点没有任何统一入口把关，全靠每个文件自己调鉴权，而它们是权限最高、
      # 也最危险的一批（删用户、改通告状态、清空提示词、重建精选集）。
      # 本步骤从**文件系统枚举**端点（代码增删自动跟上），逐个以未登录身份打一遍，
      # 再单独测越权（IDOR）与提权，并核对库里确实没变；
      # 最后以**登录的普通用户**身份再扫一遍，要求放行的端点**恰好**是一张
      # 逐个读过源码的白名单（8 个），且响应里不得出现他人数据 ——
      # 这样「某端点日后被放宽到登录即可」会立刻报红，而不是靠人去读源码发现。
      - name: Test — 管理后台 API 鉴权面（未登录/越权/提权/普通用户白名单，221 项）
        working-directory: favshub-nuxt
        run: node scripts/admin-auth-guard.mjs

      # 整个 /api 的「公开面」。226 个端点里哪些不需要登录就能访问，此前没有任何东西
      # 记录 —— 而这是最容易悄悄出错的地方（把 requireAuth 写成 optionalAuth、新端点
      # 忘了加鉴权、某个端点从「返回点公开数据」变成「返回全部数据」）。
      # 本步骤把公开面变成一张逐个读过源码的白名单，逐条比对。
      - name: Test — 全站 API 公开面契约（未登录可达端点，261 项）
        working-directory: favshub-nuxt
        run: node scripts/api-public-surface.mjs

      # 「公开面不许漏密钥」。226 个端点里唯一按设计吐明文的是 /api/token-keys/:id/copy；
      # 种一条真实形态的明文进临时库，断言明文只出现在它那里。同时钉住 /api/settings 的
      # 按值脱敏，并**反向**断言脱敏没误杀 showPasswordsLink 这类正常设置。
      - name: Test — 公开面密钥泄露扫描（明文出口契约，23 项）
        working-directory: favshub-nuxt
        run: node scripts/public-secret-scan.mjs

      # 游客订阅生命周期。这条链路**不需要账号**就发放能力令牌（sub_token），此前零覆盖。
      # 重点钉住：404 文案在「不存在/过短/已退订」之间必须逐字节一致（否则成了 token 存在性探针），
      # 以及两个限流键都要把 IPv6 收敛到 /64（否则同一个人换地址就能重置配额）。
      - name: Test — 游客订阅生命周期（能力令牌/限流 /64 聚合，53 项）
        working-directory: favshub-nuxt
        run: node scripts/deal-subscriptions.mjs

      # SSR head 的注入契约。管理员 TDK 与用户可控的通告标题/精选集名称都进 <title> 与 meta 属性，
      # 一处漏转义就是存储型 XSS。转义由 unhead 负责 —— 它是依赖，升级就可能变行为，所以要钉住。
      # 套件第 1 组先拿已知安全/危险样本给「判定器」做自检，防止判定器写错导致永久假绿。
      - name: Test — SSR head 注入契约（存储型 XSS，41 项）
        working-directory: favshub-nuxt
        run: node scripts/head-injection.mjs

      # 这个套件此前**一直不在 CI 里**（147 项断言），是这轮逐个跑 scripts/ 下
      # 34 个脚本时发现的缺口。它的覆盖面与已有几个并不重叠，尤其：
      #   · 迁移：已有 80 条存量数据的旧库能否平滑升上来
      #   · 生产一致性快照迁移（真实旧库：80 通告 / 208 游客评测 / 3 用户）
      #   · 领取地址 {邀请码} 占位符的纯函数单测（三种写法 + 全角括号）
      #   · 游客发布通道模块级（真实 INSERT + 真实校验）
      # 前两项是**其它套件完全没有**的 —— 迁移出问题不会有人提前知道。
      #
      # 它需要 Node ≥22.6（内部 `await import('...invite-codes.ts')` 直接加载 .ts
      # 源码做纯函数单测）。CI 是 22，天然满足；本机若混装会两头堵，详见该脚本头部。
      - name: Test — 第三批服务端（迁移/占位符/游客通道，147 项）
        working-directory: favshub-nuxt
        run: node scripts/third-batch-server.mjs

      # ── 文档里的「断言总数」是否与实际一致 ────────────────────
      #
      # 这个数字散落在 DEPLOYMENT-STATE.md（表格+正文）与本文档注释里，至少 7 处。
      # 它**不影响任何测试**，所以 CI 从来不会因此报警 —— 结果是同类修正
      # 在本仓库已做过 6 次（638→672→677→803→808，每次都靠人肉搜替换）。
      #
      # 这一步会**重跑一遍上面 8 个套件**。实测 **37 秒**（2026-10-31 清洁环境）：
      # 8 个套件本身合计约 26 秒，加启动开销即 37 秒。
      # 明知重复，为什么仍这么做：
      #   · 备选方案是让上面每个步骤把「通过数」解析出来写进 json ——
      #     那要在 7 个步骤里各塞一段 shell 正则，而各套件输出格式并不统一
      #     （`═══ 结果：N 通过` / `通过 N / N` / `通过 N 项`…），
      #     维护成本与出错概率都高于「多跑 37 秒」；
      #   · CI 全程约 4–6 分钟，+37s 约 10%，可以接受。
      #
      # 顺带的好处：`assertion-count.mjs` 自身也被 CI 覆盖了 ——
      # 它探测 ABI、挑 Node ≥22、解析输出格式，任何一环坏掉都会在这里暴露。
      - name: Check — 文档里的断言总数与实测一致
        working-directory: favshub-nuxt
        run: node scripts/assertion-count.mjs --check

      # 技能包真源在仓库顶层 `favshub-data-ops/`，而对用户分发的
      # `public/skills/favshub-data-ops.json` 是**生成物且必须入库** ——
      # Docker 构建上下文只有 `favshub-nuxt/`，容器内看不到顶层源目录，
      # 所以清单只能在本地/CI 生成后随镜像分发。
      #
      # 两者之间没有任何自动同步：源改了却忘了重新生成，用户 AI 助手
      # 自查更新时拿到的就是**过期文档**（它们完全依赖这份清单自我更新）。
      # 这类漂移不会让任何测试变红，只能靠这一步拦。
      - name: Check — 技能包分发清单与源文件一致
        working-directory: favshub-nuxt
        run: node scripts/build-skill-manifest.mjs --check

      # 注意：这里**不需要**再把 .output 拷成 `favshub/` 之类的中间目录。
      # 后面 `docker/build-push-action` 的 context 是整个 `favshub-nuxt`，
      # Dockerfile 内部会自己 `pnpm install` + `pnpm build`（多阶段构建）。
      # 原本有一个 `Prepare Docker context` 步骤做这件事，但那个目录从未被
      # Dockerfile 或 .dockerignore 引用 —— 已删除（2026-10-31）。
      # 上面这次 `pnpm build` 仍然保留，作用是「在 node 22 上先验证能构建」，
      # 让构建错误更早暴露；产物本身被 .dockerignore 的 `.output` 排除，不会进 context。

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: favshub-nuxt
          file: favshub-nuxt/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
