name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - 'favshub-nuxt/VERSION'
  workflow_dispatch:

env:
  IMAGE_NAME: favshub
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VER=$(cat favshub-nuxt/VERSION | tr -d '[:space:]')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 刻意**不写** `with.version`。该 action 的优先级是
        #   ① with.version 显式指定 → ② package.json 的 packageManager → ③ latest
        # 原先写的是 `version: latest`，等于走 ①，把
        # `favshub-nuxt/package.json` 里 `packageManager: pnpm@9.15.4`（带 sha512）
        # **覆盖掉**了。
        #
        # 为什么必须跟随项目锁定的版本（2026-10-31）：
        #   · pnpm-lock.yaml 是 `lockfileVersion: '9.0'`（pnpm 9 的格式）；
        #   · Dockerfile 里 `corepack prepare pnpm@9.15.4 --activate` 也钉死 9.15.4；
        #   · 若 CI 用 pnpm 10，--frozen-lockfile 虽能读 9.0，但两类实现差异
        #     （peer 解析、依赖提升）可能让「CI 装的依赖」≠「镜像里装的依赖」，
        #     于是测试通过不代表镜像里是同一套依赖 —— 这种偏差极难排查。
        #   · pnpm 大版本还会改变 lockfile 格式，届时本地与 CI 互相改锁文件的噪音。
        #
        # 省略后 action 读 packageManager 字段（唯一真源，与 Dockerfile 一致）。
        # 若将来升级 pnpm，改 package.json + Dockerfile 两处即可，这里自动跟随。

      # 刻意不启用 setup-node 的 pnpm 缓存：lockfile 在子目录时，其 post 步骤会因
      # pnpm store 目录不存在而报 "Path(s) specified ... do(es) not exist"，使整个
      # run 显示失败（镜像其实已推送成功），掩盖真实故障。缓存收益约 1 分钟，不值。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: favshub-nuxt
        run: pnpm install --frozen-lockfile

      # ── 测试门禁 ───────────────────────────────────────────────
      # 这些套件**不需要数据库、不需要 .output 构建产物**，所以能在 build 之前跑，
      # 快速失败（省一次几分钟的镜像构建 + 一次错误的 GHCR 推送）。
      #
      # 只挑自包含的：end-to-end 套件（third-batch-*、second-batch-e2e、ai-api-smoke-*）
      # 要起本地服务 + 真实 SQLite，CI 里没有该环境，故不纳入。
      # 计入断言数：102 + 17 + 12 = 131 项。
      - name: Type check (named imports)
        working-directory: favshub-nuxt
        run: pnpm ts:check

      - name: Test — SSRF 内网地址判定
        working-directory: favshub-nuxt
        run: node scripts/private-ip-check.mjs

      # 该脚本 import 了 server/utils/sanitize.ts，依赖 Node 的原生 TS 类型剥离。
      # 显式给 flag：Node 22.6–22.17 需要它，22.18+ / 24 视为无害别名。
      - name: Test — 出站错误脱敏
        working-directory: favshub-nuxt
        run: node --experimental-strip-types scripts/sanitize-test.mjs

      - name: Test — SSRF 出站地址钉死（TOCTOU）
        working-directory: favshub-nuxt
        run: node scripts/ssrf-pin-check.mjs

      - name: Build Nuxt
        working-directory: favshub-nuxt
        run: pnpm build

      # ── 端到端套件（774 项断言）─────────────────────────────────
      # 这三个套件需要 `.output/`（自起服务 + 临时库），所以排在 build 之后。
      # 它们**在此前从未进过 CI**，只在本地手工跑过 —— 意味着「线上那条流水线
      # 从没验证过这 774 项」，只有维护者想起来才会跑。补上这一环。
      #
      # 关于 Node 版本：套件内部用 `spawn('node', ...)` 起服务（拿 PATH 上的 node），
      # 而 better-sqlite3 是原生模块、ABI 与 Node 大版本绑定。CI 全程 node 22
      # （install 与 run 同版本），所以一致；本地则要注意别用「装依赖的 node」
      # 之外的版本去跑，否则会得到「应用 30s 内未就绪」这种误导性报错。
      #
      # 三个套件实测合计约 9–15 秒（138 / 161 / 247 项），成本可忽略。
      - name: Test — 第二批次 e2e（权限/可见性/SSRF）
        working-directory: favshub-nuxt
        run: node scripts/second-batch-e2e.mjs

      - name: Test — 通告事件流（脱敏/码池/订阅）
        working-directory: favshub-nuxt
        run: node scripts/third-batch-notify.mjs

      - name: Test — 通告详情页 SSR（两行可见性/内部字段）
        working-directory: favshub-nuxt
        run: node scripts/third-batch-detail.mjs

      # 限流与缓存两个套件也自包含（自己 spawn 服务、自己按 phase 覆盖 FAVSHUB_RL_*）。
      # ratelimit 把 `.output` 整体拷到 /tmp 再从副本启动，不污染工作区。
      # 实测 13s + 1s。
      - name: Test — 限流（三层阈值/并发释放/IP 取用）
        working-directory: favshub-nuxt
        run: node scripts/third-batch-ratelimit.mjs

      - name: Test — 缓存与隐私（Cache-Control/Vary/SSR payload）
        working-directory: favshub-nuxt
        run: node scripts/cache-privacy-check.mjs

      # 注意：这里**不需要**再把 .output 拷成 `favshub/` 之类的中间目录。
      # 后面 `docker/build-push-action` 的 context 是整个 `favshub-nuxt`，
      # Dockerfile 内部会自己 `pnpm install` + `pnpm build`（多阶段构建）。
      # 原本有一个 `Prepare Docker context` 步骤做这件事，但那个目录从未被
      # Dockerfile 或 .dockerignore 引用 —— 已删除（2026-10-31）。
      # 上面这次 `pnpm build` 仍然保留，作用是「在 node 22 上先验证能构建」，
      # 让构建错误更早暴露；产物本身被 .dockerignore 的 `.output` 排除，不会进 context。

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: favshub-nuxt
          file: favshub-nuxt/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
