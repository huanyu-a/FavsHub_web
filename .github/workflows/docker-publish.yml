name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - 'favshub-nuxt/VERSION'
  workflow_dispatch:

env:
  IMAGE_NAME: favshub
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VER=$(cat favshub-nuxt/VERSION | tr -d '[:space:]')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: favshub-nuxt/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: favshub-nuxt
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt
        working-directory: favshub-nuxt
        run: pnpm build

      - name: Prepare Docker context
        working-directory: favshub-nuxt
        run: |
          rm -rf favshub/
          mkdir -p favshub
          cp -r .output/server favshub/server
          rm -rf favshub/server/node_modules
          cp -r .output/public favshub/public 2>/dev/null || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: favshub-nuxt
          file: favshub-nuxt/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
