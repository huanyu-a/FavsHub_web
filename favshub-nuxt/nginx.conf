server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # ── 真实客户端 IP 还原（按 IP 限频 / 指纹去重的前提）──
    # 链路：宝塔 nginx(443) → 本容器(3090) → favshub:3000。
    # 宝塔已把真实 IP 写入 X-Forwarded-For，但**本容器此前未启用 realip**，
    # 导致 $remote_addr 恒为 docker 网关地址：
    #   - 应用侧 getClientIP() 对所有访客返回同一地址
    #   - 所有游客共用同一指纹 → 同一通告只能存在一条游客评测（功能失效）
    #   - 所有按 IP 限频退化为「全站共享配额」（更危险）
    # 启用 realip 后 $remote_addr 即真实客户端 IP，并经 X-Real-IP 传给应用。
    # real_ip_recursive on 从右往左取第一个「非可信代理」地址，故客户端伪造
    # X-Forwarded-For 也无法顶掉真实 IP（可信段已由 set_real_ip_from 声明）。
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── 压缩：回源体积从 ~232KB HTML 明显下降，CF 仍可再 br ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject;

    # 本地化 favicon：挂载卷直出（绕过 Nitro 构建期静态清单）
    location /images/favicons/ {
        alias /favicons/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # 其它图片
    location /images/ {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 评测看板单页（eval-api 每日 08:00 步骤链末尾 publish_eval.py 原子写入；
    # usage.json 由 token-report/refresh.py 每 30 分钟双写）
    location = /tokens/eval {
        return 301 /tokens/eval/;
    }
    location /tokens/eval/ {
        alias /eval-page/;
        index index.html;
        access_log off;
        add_header Cache-Control "no-cache" always;
    }

    # Nuxt 构建产物（带 hash，可长期缓存）
    location /_nuxt/ {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # 全局 CSS / 字体 / vendor（query 版本号变更时自动刷新）
    location /css/ {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /vendor/ {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /fonts/ {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /favicon.ico {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # 站点根 PNG 图标：不加专属 location 会落入 location / 被 private,no-cache 抵消长缓存
    location = /favicon.png {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /apple-touch-icon.png {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # QQ 头像代理：内容稳定（URL 即内容指纹），需长缓存。
    # 不加精确 location 会落入 location / 被 private,no-cache 抵消长缓存。
    location /avatar/ {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 技能分发清单：公开静态资源，需长缓存（落入 location / 会被 private,no-cache 抵消）
    location /skills/ {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # HTML / API 等：反代 Nuxt（不缓存 HTML，由 gzip 减小回源体积）
    location / {
        proxy_pass http://favshub:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        # 动态页短缓存头，避免被中间层误缓存登录态 HTML
        add_header Cache-Control "private, no-cache" always;
    }
}
