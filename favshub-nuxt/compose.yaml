services:
  favshub:
    build:
      context: .
      dockerfile: Dockerfile
    image: favshub:latest
    environment:
      - TZ=Asia/Shanghai
      - NUXT_JWT_SECRET=${NUXT_JWT_SECRET:-}
      - NUXT_DB_PATH=/opt/favshub/data/favshub.db
      - NUXT_CORS_ORIGIN=${NUXT_CORS_ORIGIN:-}
      - NUXT_ADMIN_USERS=${NUXT_ADMIN_USERS:-}
    dns:
      - 119.29.29.29
      - 223.5.5.5
    volumes:
      - ./data:/opt/favshub/data
      - ./data/favicons:/opt/favshub/.output/public/images/favicons
    # 对外端口由 nginx 统一暴露
    expose:
      - "3000"
    restart: always

  nginx:
    image: nginx:alpine
    depends_on:
      - favshub
    ports:
      - "3090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/favicons:/favicons:ro
    restart: always
